name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build and spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz --directory=bin
          echo "$(pwd)/bin" >> "${GITHUB_PATH}"
      - name: Report version
        run: mdbook --version
      - name: Build book
        run: mdbook build
      - name: Install cspell
        run: npm install --no-save cspell
      - name: Spellcheck
        run: npx cspell .
  code-check:
    name: Compile book code blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact --version
      - name: Pin compiler
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1
      - name: Compile all Compact code blocks
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          bash ci/check-compact.sh
